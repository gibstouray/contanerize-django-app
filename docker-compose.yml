name: dj-container-project

services:
  dj-container:
    build: .
    container_name: dj-container
    ports:
      - "8084:8084"
    volumes:
      - .:/app

    depends_on:
      dj-postgres:
        condition: service_healthy
        restart: true

    env_file:
      - .env

  dj-postgres:
    image: postgres:17
    container_name: dj-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

volumes:
  postgres_data:
